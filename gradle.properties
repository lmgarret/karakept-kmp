org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Xmx4g -Dfile.encoding=UTF-8
# Build cache: store task outputs (Kotlin/KSP/Room compile, etc.) so unchanged
# tasks become cache hits instead of recompiles across runs and CI jobs. The
# gradle/actions/setup-gradle CI cache persists ~/.gradle/caches/build-cache-1.
org.gradle.caching=true
# Cache the Gradle configuration phase result across runs. Saves 15-30s per
# invocation after the first warm-up. Requires all tasks to be configuration-cache
# compatible (verified in CI; re-validate when adding new plugins).
org.gradle.configuration-cache=true
# Run independent module/target compiles in parallel.
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
compose.desktop.packaging.checkJdkVendor=false
# AGP 9 refuses to apply com.android.application alongside the Kotlin
# Multiplatform plugin. The supported replacement,
# com.android.kotlin.multiplatform.library, is library-only — :api-client is on
# it — so composeApp, a KMP module that *is* the Android application, has no
# migration target yet. These two flags restore AGP 8's behaviour: KGP owns
# Kotlin compilation instead of AGP's built-in Kotlin, and the legacy android {}
# DSL stays in use. They are what keeps the remaining applicationVariants /
# testVariants / unitTestVariants deprecation warnings on the build log; both
# flags and both APIs go away in AGP 10, so this needs a KMP-aware application
# plugin (or splitting the Android app into its own subproject) before then.
android.builtInKotlin=false
android.newDsl=false
