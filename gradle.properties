org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Xmx4g -Dfile.encoding=UTF-8
# Build cache: store task outputs (Kotlin/KSP/Room compile, etc.) so unchanged
# tasks become cache hits instead of recompiles across runs and CI jobs. The
# gradle/actions/setup-gradle CI cache persists ~/.gradle/caches/build-cache-1.
org.gradle.caching=true
# Cache the Gradle configuration phase result across runs. Saves 15-30s per
# invocation after the first warm-up. Requires all tasks to be configuration-cache
# compatible (verified in CI; re-validate when adding new plugins).
org.gradle.configuration-cache=true
# Run independent module/target compiles in parallel.
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
compose.desktop.packaging.checkJdkVendor=false
