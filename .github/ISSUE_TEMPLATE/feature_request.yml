name: Feature request
description: Suggest an idea for Karakept
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Is it related to a frustration you have?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - Android
        - Desktop (Linux)
        - Desktop (macOS)
        - Desktop (Windows)
        - All
    validations:
      required: false
