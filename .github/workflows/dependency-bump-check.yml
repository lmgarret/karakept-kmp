name: Dependency Bump Check

# ci.yml only runs the desktop (JVM) test suite, so a library bump that is fine on
# desktop but incompatible with the Android build (AAR metadata requirements,
# AGP/compileSdk mismatches, etc.) can merge unnoticed — the Android target is
# otherwise only compiled at release time. This workflow closes that gap by
# checking the bumped dependencies' AAR metadata against this project's
# compileSdk/AGP version whenever a dependency version actually changes, without
# paying for a full Android compile, test run, or signed build on every PR.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'

permissions:
  contents: read

jobs:
  android-build-check:
    name: Android AAR metadata check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # checkDebugAarMetadata is the exact task that catches a bumped AAR requiring
      # a higher compileSdk/AGP than this project currently targets. It lives on
      # :androidApp — :composeApp is a KMP library and has no build types — and it only
      # resolves the runtime classpath and compares metadata, with no Kotlin/KSP
      # compilation, resource merging, or packaging behind it. That keeps this
      # check fast and secret-free (no signing config is ever touched).
      - name: Check bumped dependencies' AAR metadata
        run: ./gradlew :androidApp:checkDebugAarMetadata
