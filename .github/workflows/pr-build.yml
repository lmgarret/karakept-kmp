name: PR Build

on:
  issue_comment:
    types: [created]

jobs:
  build-apk:
    name: Build dev APK
    # The job checks out the PR head and runs it with the signing secrets, so only
    # people with write access may trigger it — otherwise any commenter could run
    # a fork's code against those secrets.
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/build-apk') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # issue_comment runs on the default branch, which the release environment admits.
    environment: release
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Acknowledge command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Get PR branch
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('sha', pr.head.sha);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          submodules: true

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # The dev key (karakept-dev), never the release key: this job runs the PR's own build
      # scripts and dependencies, and the release key lives in the release-signing environment.
      - name: Decode keystore
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEV_KEYSTORE_BASE64" ]; then
            echo "::error::DEV_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$DEV_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/karakept-dev.keystore

      - name: Build dev release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/karakept-dev.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
        run: ./gradlew :androidApp:assembleDevRelease

      # Gradle signs with the debug key when no keystore is configured, so make sure it was not:
      # a debug-signed dev APK would not update over one signed with karakept-dev.
      - name: Check the APK is not debug-signed
        run: |
          APK=$(find androidApp/build/outputs/apk/devRelease -name "*.apk" | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS" | grep -E 'DN|SHA-256'
          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::The dev APK is signed with a debug certificate."
            exit 1
          fi

      - name: Upload dev release APK
        id: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dev-release-pr${{ github.event.issue.number }}
          path: androidApp/build/outputs/apk/devRelease/*.apk
          retention-days: 7

      - name: Comment on PR with APK link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- pr-apk-build -->';
            const artifactUrl = '${{ steps.upload-artifact.outputs.artifact-url }}';
            const body = [
              marker,
              '### Dev APK',
              '',
              `**[Download APK](${artifactUrl})**`,
              '',
              'Package ID: `com.karakept.app.dev` — installs alongside the production app as **Karakept Dev**.',
              '',
              `_Build [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
