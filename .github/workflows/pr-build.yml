name: PR Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'api-client/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

jobs:
  build-apk:
    name: Build dev APK
    runs-on: ubuntu-latest
    needs: [] # run in parallel with ci.yml
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ env.DEV_KEYSTORE_BASE64 != '' }}
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: echo "$DEV_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/karakept-dev.keystore

      - name: Build dev release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/karakept-dev.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
        run: ./gradlew :composeApp:assembleDevRelease

      - name: Upload dev release APK
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-release-pr${{ github.event.pull_request.number }}
          path: composeApp/build/outputs/apk/devRelease/*.apk
          retention-days: 7

      - name: Comment on PR with APK link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-apk-build -->';
            const artifactUrl = '${{ steps.upload-artifact.outputs.artifact-url }}';
            const body = [
              marker,
              '### Dev APK',
              '',
              `**[Download APK](${artifactUrl})**`,
              '',
              'Package ID: `com.karakept.app.dev` — installs alongside the production app as **Karakept Dev**.',
              '',
              `_Build [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
