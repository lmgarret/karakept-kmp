name: PR Build

on:
  issue_comment:
    types: [created]

jobs:
  build-apk:
    name: Build dev APK
    # The job checks out the PR head and runs it with the signing secrets, so only
    # people with write access may trigger it — otherwise any commenter could run
    # a fork's code against those secrets.
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/build-apk') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Acknowledge command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Get PR branch
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('sha', pr.head.sha);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          submodules: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Decode keystore
        if: ${{ env.DEV_KEYSTORE_BASE64 != '' }}
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: echo "$DEV_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/karakept-dev.keystore

      - name: Build dev release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/karakept-dev.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
        run: ./gradlew :androidApp:assembleDevRelease

      - name: Upload dev release APK
        id: upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-dev-release-pr${{ github.event.issue.number }}
          path: androidApp/build/outputs/apk/devRelease/*.apk
          retention-days: 7

      - name: Comment on PR with APK link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- pr-apk-build -->';
            const artifactUrl = '${{ steps.upload-artifact.outputs.artifact-url }}';
            const body = [
              marker,
              '### Dev APK',
              '',
              `**[Download APK](${artifactUrl})**`,
              '',
              'Package ID: `com.karakept.app.dev` — installs alongside the production app as **Karakept Dev**.',
              '',
              `_Build [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
