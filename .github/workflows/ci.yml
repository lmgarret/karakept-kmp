name: CI

on:
  pull_request:
    branches: [ main ]
    # Skip the test suite for changes that cannot affect it (docs/markdown only).
    # Any source, Gradle, or workflow change still triggers a full run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          # Cache the wrapper distribution too (not in the action's defaults), so the
          # ~120MB Gradle dist isn't re-downloaded every run once main has warmed it.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # PR CI runs only the desktop (JVM) suite: it covers all commonTest +
      # desktopTest tests — the bulk of coverage — without compiling the Android
      # target or paying the Robolectric bootstrap. The Android-only unit tests run
      # nightly (nightly-android-tests.yml) and as a release gate (release.yml).
      - name: Run desktop tests
        run: ./gradlew desktopTest --rerun
