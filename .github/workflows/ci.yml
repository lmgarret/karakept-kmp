name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic

      - name: Run tests
        run: ./gradlew test --rerun
