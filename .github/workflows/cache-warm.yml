name: Warm Gradle cache

# Seeds the Gradle dependency + build cache from the default branch.
#
# Why: gradle/actions/setup-gradle only SAVES its cache from the default branch.
# PR runs (ci.yml) and tag-triggered releases are non-default refs, so they can
# only RESTORE read-only. Without a workflow running setup-gradle on push to main,
# the cache is never populated and every job starts cold.
#
# This runs on ubuntu-latest only (1x runner cost). It warms the cache that the
# frequent, cheap paths reuse: every PR ci.yml run and the Linux release lane.
# macOS (10x) and Windows (2x) are deliberately NOT warmed here — they compile
# once per release as before and self-persist their cache (see release.yml).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only the newest commit's warm-up matters; cancel superseded runs.
concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm Gradle cache (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          # Cache the wrapper distribution too (not in the action's defaults) so PR runs
          # restore it instead of re-downloading the ~120MB Gradle dist every time.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # `desktopTest` warms the exact compile tasks PR CI reuses: ci.yml runs
      # `desktopTest --rerun`, which forces only the test tasks to re-run while the
      # upstream commonMain/desktopMain/KSP/codegen tasks resolve FROM-CACHE. It also
      # doubles as a main-branch smoke test (CI otherwise only runs on PRs).
      # `desktopJar` warms the Linux release lane, whose createDistributable depends on it.
      #
      # The Android compile path is intentionally NOT warmed here: PR CI no longer
      # compiles the Android target, and the Android unit tests run only as a release
      # gate (release.yml), which self-persists its cache.
      - name: Warm build & dependency cache
        run: ./gradlew desktopTest :composeApp:desktopJar

