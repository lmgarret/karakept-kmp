name: Nightly Android tests

# PR CI runs only the desktop (JVM) suite for speed. This workflow runs the
# Android-only unit tests (Robolectric: Activity, BroadcastReceiver, Compose UI,
# WorkManager scheduler) once a day against main so Android-specific regressions
# are still caught. The same suite also gates releases (see release.yml).

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  android-tests:
    name: Run Android unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # Only the debug variant's unit tests run (release/devRelease unit tests are
      # disabled in composeApp/build.gradle.kts since they cover identical bytecode).
      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --rerun
