name: Release

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'api-client/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3). Leave empty to auto-detect from tags.'
        required: false
        type: string

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # full history for changelog generation

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install missing language_data dependency
        run: pip install language_data

      - name: Generate AI changelog
        id: changelog
        uses: nosovj/llm-release-action@v1
        with:
          model: mistral/mistral-large-latest
          changelog_config: |
            default:
              languages: [en]
              tone: professional
              sections: [breaking, features, improvements, fixes]
              benefit_focused: true
              include_infrastructure: false
              summary_only: false
              emojis: true
          context_files: README.md,CLAUDE.md
          max_commits: 50
          temperature: 0.2
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Generate commit log
        id: commitlog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          LOG=$(git log --oneline "${PREVIOUS_TAG}..HEAD" 2>/dev/null || git log --oneline)
          # Write to output using heredoc delimiter for multiline
          {
            echo "log<<COMMITLOG_EOF"
            echo "$LOG"
            echo "COMMITLOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        run: |
          RAW="${{ inputs.version || steps.changelog.outputs.next_version || 'nightly' }}"
          # Strip leading 'v' if present to normalize
          VERSION="${RAW#v}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: echo "$DEV_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/karakept-dev.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/karakept-dev.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
        run: >
          ./gradlew :composeApp:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Compose release body
        id: body
        run: |
          CHANGELOG='${{ fromJSON(steps.changelog.outputs.changelogs).default.en }}'
          COMMITS='${{ steps.commitlog.outputs.log }}'
          {
            echo "body<<BODY_EOF"
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>Full commit log</summary>"
            echo ""
            echo '```'
            echo "$COMMITS"
            echo '```'
            echo "</details>"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create versioned release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version || steps.changelog.outputs.next_version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: composeApp/build/outputs/apk/release/*.apk
          body: ${{ steps.body.outputs.body }}
          generate_release_notes: false

      - name: Update nightly pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (#${{ github.run_number }})"
          files: composeApp/build/outputs/apk/release/*.apk
          body: ${{ steps.body.outputs.body }}
          prerelease: true
          make_latest: false
