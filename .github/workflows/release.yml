name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3). Leave empty to auto-detect from tags.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    # Holds ANTHROPIC_API_KEY; the environment only admits main and v* tags.
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Find previous tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: prev_tag
        run: |
          # --match skips the rolling `nightly` tag, which is usually nearer.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || echo "")
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate AI changelog
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: changelog
        # On tag pushes the version comes from the tag, so an LLM outage only
        # drops the AI changelog. Manual runs need next_version, so they still fail.
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: lmgarret/llm-release-action@d0581cd59ed14f3db5864b2ca6479a6623c308ab # v2.1.0
        with:
          model: anthropic/claude-sonnet-5-5
          # Cheap model for project type, context and diff extraction.
          fast_model: anthropic/claude-haiku-5-5
          # The range comes from base_ref; the action reads current_version off the
          # semver base tag, so next_version still works for manual runs.
          base_ref: ${{ steps.prev_tag.outputs.tag }}
          # End-user app: internal database migrations are not breaking.
          project_type: app
          # Short, so it fits the token budget without being summarized.
          context_files: /docs/CONTEXT.md
          changelog_config: |
            default:
              # `customer` sets user_facing_only, dropping CI and dependency churn.
              preset: customer
              languages: [en]
              tone: professional
              sections: [breaking, features, improvements, fixes]
              benefit_focused: true
              include_infrastructure: false
              user_facing_only: true
              summary_only: false
              emojis: true
              link_prs: true
              # The preset generates metadata the release body never uses.
              generate_title: false
              generate_summary: false
              generate_highlights: 0
              # No header: the changelog already opens with its own heading.
              footer: |
                **Upgrading from {previous_version}?** Your settings, bookmarks and
                local database are kept — install the new build over the old one.
              instructions: |
                Write for people who use the app, not for its developers.
                Name the platform (Android, macOS, Linux) when a change only affects one.
                Never mention CI, dependency bumps, tests or refactoring.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate commit log
        id: commitlog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          LOG=$(git log --oneline "${PREVIOUS_TAG}..HEAD" 2>/dev/null || git log --oneline)
          {
            echo "log<<COMMITLOG_EOF"
            echo "$LOG"
            echo "COMMITLOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RAW="${{ inputs.version || steps.changelog.outputs.next_version || 'nightly' }}"
            VERSION="${RAW#v}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        env:
          COMMITS: ${{ steps.commitlog.outputs.log }}
          # Read the file the action wrote instead of passing LLM text through a shell.
          CHANGELOG_FILE: ${{ steps.changelog.outputs.changelog_files && fromJSON(steps.changelog.outputs.changelog_files).default.en || '' }}
        run: |
          {
            echo "body<<BODY_EOF"
            if [ -n "$CHANGELOG_FILE" ] && [ -f "$CHANGELOG_FILE" ]; then
              cat "$CHANGELOG_FILE"
              echo ""
              echo "---"
              echo ""
            fi
            echo "<details><summary>Full commit log</summary>"
            echo ""
            echo '```'
            echo "$COMMITS"
            echo '```'
            echo "</details>"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  android-tests:
    name: Run Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # PR CI only runs the desktop suite, so validate the Android-only unit tests
      # here before any release artifact is built or published.
      - name: Run Android unit tests
        run: ./gradlew :composeApp:testAndroidHostTest --rerun

  build-android:
    name: Build Android APK
    needs: [resolve-version, android-tests]
    runs-on: ubuntu-latest
    # Holds the signing keystore; the environment only admits main and v* tags.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          # Cache the wrapper distribution too (not in the action's defaults) so the
          # ~120MB Gradle dist isn't re-downloaded on every release.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Decode keystore
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: echo "$DEV_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/karakept-dev.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/karakept-dev.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
        run: >
          ./gradlew :androidApp:assembleRelease
          -PversionName=${{ needs.resolve-version.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "androidApp/build/outputs/apk/release/Karakept-${{ needs.resolve-version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-release
          path: androidApp/build/outputs/apk/release/Karakept-*.apk

  build-macos:
    name: Build macOS DMG
    needs: [resolve-version, android-tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Releases run on tags (non-default ref), where setup-gradle defaults to a
      # read-only cache. Allow writes so back-to-back releases reuse this runner's
      # compiled outputs. No extra job/run is added — only a cache-save step.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          # Cache the wrapper distribution too (not in the action's defaults) so the
          # ~120MB Gradle dist isn't re-downloaded on every release.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Build DMG
        run: >
          ./gradlew :composeApp:packageDmg
          -PversionName=${{ needs.resolve-version.outputs.name }}

      - name: Resolve DMG path
        id: dmg
        run: |
          DMG_FILE=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" | head -1)
          echo "path=$DMG_FILE" >> "$GITHUB_OUTPUT"
          SHA=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-release
          path: composeApp/build/compose/binaries/main/dmg/Karakept-*.dmg

  build-windows:
    name: Build Windows (MSI + EXE)
    needs: [resolve-version, android-tests]
    # Windows release builds are temporarily disabled. To re-enable: remove this
    # `if: false`, re-add `build-windows` to create-release's `needs`, and restore the
    # `msi-release/*.msi` + `exe-release/*.exe` lines in create-release's file lists.
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # See build-macos: allow cache writes on tag-triggered releases so
      # consecutive releases reuse compiled outputs. No extra run is added.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          # Cache the wrapper distribution too (not in the action's defaults) so the
          # ~120MB Gradle dist isn't re-downloaded on every release.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Build Windows installers
        # Quote the property: PowerShell (the default Windows shell) otherwise splits an
        # unquoted -PversionName=1.13.0 into "-PversionName=1" + ".13.0", so Gradle would
        # see versionName=1 and fail Windows' MAJOR.MINOR.BUILD version validation.
        run: >
          .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe
          "-PversionName=${{ needs.resolve-version.outputs.name }}"

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-release
          path: composeApp/build/compose/binaries/main/msi/*.msi

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-release
          path: composeApp/build/compose/binaries/main/exe/*.exe

  build-linux-dist:
    name: Build Linux distributable
    needs: [resolve-version, android-tests]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # basic = open-source (MIT) cache provider; v6's default 'enhanced'
          # provider is proprietary under Gradle's commercial Terms of Use.
          cache-provider: basic
          # Cache the wrapper distribution too (not in the action's defaults) so the
          # ~120MB Gradle dist isn't re-downloaded on every release.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Build distributable and prepare Flatpak sources
        run: >
          ./gradlew :composeApp:createDistributable :composeApp:flatpakResizeIcon
          -PversionName=${{ needs.resolve-version.outputs.name }}

      - name: Upload Linux distributable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-dist-for-flatpak
          path: |
            composeApp/build/compose/binaries/main/app/Karakept/
            composeApp/build/flatpak/icon-512.png

  build-linux-flatpak:
    name: Build Linux Flatpak
    needs: [resolve-version, build-linux-dist]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download Linux distributable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-dist-for-flatpak
          path: composeApp/build

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Karakept.flatpak
          manifest-path: flatpak/com.karakept.app.yml
          cache-key: gnome-48
          upload-artifact: false

      - name: Rename Flatpak
        run: mv Karakept.flatpak "Karakept-${{ needs.resolve-version.outputs.name }}.flatpak"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-release
          path: Karakept-*.flatpak

  create-release:
    name: Create GitHub Release
    # build-windows temporarily removed from needs (Windows release builds disabled)
    needs: [resolve-version, build-android, build-macos, build-linux-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      # Lets users check a download came from this workflow:
      # gh attestation verify <file> -R lmgarret/karakept-kmp
      - name: Attest build provenance
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apk-release/*.apk
            dmg-release/*.dmg
            flatpak-release/*.flatpak

      - name: Create versioned release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            apk-release/*.apk
            dmg-release/*.dmg
            flatpak-release/*.flatpak
          body: ${{ needs.resolve-version.outputs.body }}
          generate_release_notes: false

      - name: Update nightly pre-release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          name: "Nightly (#${{ github.run_number }})"
          files: |
            apk-release/*.apk
            dmg-release/*.dmg
          body: ${{ needs.resolve-version.outputs.body }}
          prerelease: true
          make_latest: false

      - name: Update Homebrew cask
        if: false
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.name }}"
          SHA256=$(shasum -a 256 dmg-release/Karakept-*.dmg | awk '{print $1}')

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/lmgarret/homebrew-karakept.git" tap-repo
          cd tap-repo

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/karakept.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/karakept.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/karakept.rb
          git diff --cached --quiet || git commit -m "Update karakept to ${VERSION}"
          git diff --cached --quiet || git push
