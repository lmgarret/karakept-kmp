name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # full history for changelog generation

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: echo "$DEV_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/karakept-dev.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/karakept-dev.keystore
          KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
        run: >
          ./gradlew :composeApp:assembleRelease
          -PversionName=${{ inputs.version || 'nightly' }}
          -PversionCode=${{ github.run_number }}

      - name: Generate AI changelog
        id: changelog
        uses: nosovj/llm-release-action@v1
        with:
          model: mistral/mistral-small-latest
          changelog_config: |
            audiences:
              - name: default
                languages: [en]
                tone: friendly
                sections: [breaking, features, improvements, fixes, performance, infrastructure]
          context_files: README.md,CLAUDE.md
          max_commits: 50
          temperature: 0.2
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Create versioned release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "v${{ inputs.version }}"
          files: composeApp/build/outputs/apk/release/*.apk
          body: ${{ fromJSON(steps.changelog.outputs.changelogs).default.en }}
          generate_release_notes: false

      - name: Update nightly pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (#${{ github.run_number }})"
          files: composeApp/build/outputs/apk/release/*.apk
          body: ${{ fromJSON(steps.changelog.outputs.changelogs).default.en }}
          prerelease: true
          make_latest: false
